[package]
name="ctfcracktools-bridge"
version="0.1.2"
edition="2021"
license="GPL-3.0-only"

[dependencies]

# Tauri

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 编码
base64 = "0.22"
data-encoding = "2"
percent-encoding = "2"
hex = "0.4"

# 哈希
md5 = "0.8"
sha1 = "0.10"
sha2 = "0.10"

# 加密
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rc4 = "0.1"
block-padding = "0.3"
des = "0.8"
blowfish = "0.9"

# HMAC & KDF
hmac = "0.12"
pbkdf2 = "0.12"

# Utility
lazy_static = "1.5"

# 错误处理
thiserror = "1"

# 日志
log = "0.4"

[profile.release]
opt-level="s"
strip=true
